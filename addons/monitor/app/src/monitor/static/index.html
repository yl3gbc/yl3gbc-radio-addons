<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SONIKS MONITOR</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <span class="logo"></span>
        <div>
          <div class="brand-sub" data-i18n="brand_sub"></div>
          <div class="brand-name">SONIKS Monitor</div>
        </div>
      </div>

      <nav class="pills">
        <button class="pill active" data-page="overview" data-i18n="nav_overview"></button>
        <button class="pill" data-page="orbit" data-i18n="nav_orbit"></button>
        <button class="pill" data-page="history" data-i18n="nav_history"></button>
        <button class="pill" data-page="guide" data-i18n="nav_guide"></button>
        <button class="pill" data-page="faq">FAQ</button>
      </nav>

      <div class="langs">
        <button class="pill lang" data-lang="ru">🇷🇺 RU</button>
        <button class="pill lang" data-lang="en">🇬🇧 EN</button>
      </div>

      <div class="clock">
        <div class="clock-label" data-i18n="utc_date"></div>
        <div class="clock-value" id="utc-date"></div>
        <div class="clock-label" data-i18n="utc_time"></div>
        <div class="clock-value" id="utc-time"></div>
      </div>
    </div>
  </header>

  <main class="wrap content">
    <section id="page-overview" class="page">
      <nav class="tabs">
        <button class="pill active" data-tab="station" data-i18n="tab_station"></button>
        <button class="pill" data-tab="satellite" data-i18n="tab_satellite"></button>
        <button class="pill" data-tab="journal" data-i18n="tab_journal"></button>
        <button class="pill" data-tab="map" data-i18n="tab_map"></button>
        <button class="pill" data-tab="signal" data-i18n="tab_signal"></button>
      </nav>

      <div id="tab-station" class="tab">
        <div class="grid3" id="own-station"></div>

        <form class="compare" id="compare-form">
          <select id="compare-online"><option value="" data-i18n="online_pick"></option></select>
          <input id="compare-id" inputmode="numeric" autocomplete="off">
          <button class="pill" type="submit" data-i18n="compare"></button>
        </form>

        <div class="panel hidden" id="compare-panel">
          <div class="panel-title" id="compare-title"></div>
          <div class="grid3" id="compare-station"></div>
        </div>

        <div class="grid4" id="system"></div>
      </div>

      <div id="tab-satellite" class="tab hidden">
        <div class="journal-bar">
          <select id="sat-select" class="wide-select"></select>
        </div>
        <div class="grid4" id="sat-summary"></div>
        <div class="sat-top">
          <div class="panel sat-best">
            <div class="panel-title" data-i18n="sat_best"></div>
            <div id="sat-best"></div>
          </div>
          <div class="panel sat-days">
            <div class="panel-title" data-i18n="sat_days"></div>
            <div class="table-wrap"><table class="tbl" id="sat-days"></table></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-title" data-i18n="sat_latest"></div>
          <div class="table-wrap"><table class="tbl" id="sat-latest"></table></div>
        </div>
      </div>

      <div id="tab-journal" class="tab hidden">
        <div class="journal-bar">
          <button class="pill" id="j-prev" type="button">◀</button>
          <select id="j-day"></select>
          <button class="pill" id="j-next" type="button">▶</button>
          <button class="pill" id="j-today" type="button" data-i18n="j_today"></button>
        </div>

        <div class="grid4" id="j-summary"></div>

        <div class="panel">
          <div class="panel-title" data-i18n="j_per_sat"></div>
          <div class="table-wrap"><table class="tbl" id="j-sats"></table></div>
        </div>

        <div class="panel">
          <div class="panel-title" data-i18n="j_observations"></div>
          <div class="table-wrap"><table class="tbl" id="j-obs"></table></div>
        </div>
      </div>

      <div id="tab-map" class="tab hidden">
        <div class="map-top">
          <div class="panel map-panel">
            <div class="panel-title"><span data-i18n="m_map"></span> <span class="map-now" id="m-now"></span></div>
            <svg id="m-map" class="map" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <div class="panel polar-panel">
            <div class="panel-title" data-i18n="m_polar"></div>
            <svg id="m-polar" class="polar" viewBox="-110 -110 220 220"></svg>
            <div id="m-pass"></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-title" data-i18n="m_passes"></div>
          <div class="table-wrap"><table class="tbl" id="m-passes"></table></div>
        </div>
      </div>

      <div id="tab-signal" class="tab hidden">
        <div class="journal-bar">
          <button class="pill" id="s-prev" type="button">◀</button>
          <select id="s-day"></select>
          <button class="pill" id="s-next" type="button">▶</button>
          <button class="pill" id="s-today" type="button" data-i18n="j_today"></button>
          <select id="s-sat"><option value="" data-i18n="s_all_sats"></option></select>
          <label class="check"><input type="checkbox" id="s-decoded"> <span data-i18n="s_decoded_only"></span></label>
        </div>
        <div class="wf-count" id="s-count"></div>
        <div class="wf-grid" id="s-grid"></div>
      </div>

      <div id="tab-placeholder" class="tab hidden">
        <div class="card wide"><div class="card-label" data-i18n="soon"></div></div>
      </div>
    </section>

    <section id="page-history" class="page hidden">
      <div class="journal-bar">
        <button class="pill" type="button" data-hdays="7">7 <span data-i18n="h_days"></span></button>
        <button class="pill active" type="button" data-hdays="30">30 <span data-i18n="h_days"></span></button>
        <button class="pill" type="button" data-hdays="90">90 <span data-i18n="h_days"></span></button>
        <span class="map-now" id="h-range"></span>
      </div>
      <div class="grid4" id="h-summary"></div>
      <div class="panel chart-panel">
        <div class="chart-head">
          <div class="panel-title" data-i18n="h_obs_chart"></div>
          <div class="legend">
            <span><i class="sw" style="background: var(--c-decoded)"></i><span data-i18n="j_decoded"></span></span>
            <span><i class="sw" style="background: var(--c-other)"></i><span data-i18n="h_not_decoded"></span></span>
          </div>
        </div>
        <div class="chart" id="h-obs"></div>
      </div>
      <div class="charts2">
        <div class="panel chart-panel">
          <div class="panel-title" data-i18n="h_packets_chart"></div>
          <div class="chart" id="h-packets"></div>
        </div>
        <div class="panel chart-panel">
          <div class="panel-title" data-i18n="h_sats_chart"></div>
          <div class="chart" id="h-sats"></div>
        </div>
        <div class="panel chart-panel">
          <div class="panel-title" data-i18n="h_snr_chart"></div>
          <div class="chart" id="h-snr"></div>
        </div>
        <div class="panel chart-panel">
          <div class="panel-title" data-i18n="h_noise_chart"></div>
          <div class="chart" id="h-noise"></div>
        </div>
      </div>
      <details class="panel">
        <summary class="panel-title" data-i18n="h_table"></summary>
        <div class="table-wrap"><table class="tbl" id="h-table"></table></div>
      </details>
      <div class="chart-tip hidden" id="h-tip"></div>
    </section>

    <section id="page-placeholder" class="page hidden">
      <div class="card wide"><div class="card-label" data-i18n="soon"></div></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
