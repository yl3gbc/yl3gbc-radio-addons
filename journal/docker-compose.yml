services:
  journal:
    image: sonikspace/soniks-client:latest-addons
    container_name: soniks-journal
    user: root
    volumes:
      - client-x_soniks-client:/var/lib/soniks-client:ro
      - ./journal.py:/opt/yl3gbc-journal/journal.py:ro
      - journal-data:/var/lib/yl3gbc-journal
    command: python3 /opt/yl3gbc-journal/journal.py
    healthcheck:
      disable: true
    restart: unless-stopped
volumes:
  client-x_soniks-client:
    external: true
  journal-data:
