[project]
name = "db_dev"
version = "2.1.0"
description = "Python 3.15 access to DuckDB 2.1.0-dev through its C API (ctypes, no compiled binding)"
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_dev"]
