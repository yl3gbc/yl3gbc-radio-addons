# mosquitto -> InfluxDB.
# Topics published by the monitor:
#   soniks/<station_id>/health  - station state from /healthz
#   soniks/<station_id>/pass    - per observation: signal, noise, decodable
# Measurement name and station tag are taken from the topic.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "soniks"
  bucket = "soniks"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["soniks/+/health", "soniks/+/pass"]
  qos = 1
  client_id = "telegraf"
  persistent_session = true
  data_format = "json"
  json_time_key = "time"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  tag_keys = ["norad", "satellite", "mode", "decoder"]
  json_string_fields = ["observation_id"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "soniks/+/+"
    measurement = "_/_/measurement"
    tags = "_/station/_"
