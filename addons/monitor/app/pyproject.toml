[project]
name = "soniks-monitor"
version = "0.0.0"
description = "SONIKS Monitor addon for soniks-client 3.x"
requires-python = ">=3.15"
dependencies = [
    "db_dev",
    "fastapi",
    "uvicorn",
    "paho-mqtt>=2.1",
]

[project.scripts]
soniks-monitor = "monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]
